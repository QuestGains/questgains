name: Build Android TWA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk-path: ${{ steps.find-apk.outputs.apk-path }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          # Use sdkmanager directly — no setup-android action (flaky on ubuntu-latest)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platform-tools" > /dev/null 2>&1
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Set up Gradle wrapper
        run: chmod +x twa-android/gradlew

      - name: Restore keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/questgains-release.keystore
          # Sanity check
          SIZE=$(wc -c < $GITHUB_WORKSPACE/questgains-release.keystore)
          echo "Keystore size: ${SIZE} bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "ERROR: keystore decoded to ${SIZE} bytes — KEYSTORE_BASE64 secret is likely empty or corrupted"
            exit 1
          fi

      - name: Build AAB + APK
        run: |
          cd twa-android
          # AAB for Play Store upload
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/questgains-release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.store.type=PKCS12 \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            --stacktrace
          # APK for emulator smoke test
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/questgains-release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.store.type=PKCS12 \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            --stacktrace

      - name: Find outputs
        id: find-apk
        run: |
          AAB=$(find twa-android -name "*.aab" | head -1)
          APK=$(find twa-android -name "*.apk" | head -1)
          echo "AAB: $AAB"
          echo "APK: $APK"
          echo "apk-path=$APK" >> $GITHUB_OUTPUT

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: questgains-android-aab
          path: twa-android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: questgains-android-apk
          path: twa-android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable KVM for faster emulator boot
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: questgains-android-apk
          path: ${{ github.workspace }}

      - name: Verify APK present
        run: |
          find $GITHUB_WORKSPACE -name "*.apk" | head -5
          ls -lh $GITHUB_WORKSPACE/*.apk 2>/dev/null || echo "no apk at root — check above"

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: APK=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*.apk" | head -1); [ -n "$APK" ] || { echo "NO APK FOUND"; ls -R "$GITHUB_WORKSPACE"; exit 1; }; echo "Installing $APK"; adb logcat -c; adb logcat > "$GITHUB_WORKSPACE/launch_logcat.txt" 2>&1 & LOGCAT_PID=$!; adb install -r "$APK"; adb shell monkey -p com.questgains.mobile -c android.intent.category.LAUNCHER 1; sleep 15; kill $LOGCAT_PID 2>/dev/null; adb logcat -d >> "$GITHUB_WORKSPACE/launch_logcat.txt" 2>/dev/null; echo "=== LOGCAT ==="; cat "$GITHUB_WORKSPACE/launch_logcat.txt"; echo "=== END LOGCAT ==="; grep -q "FATAL EXCEPTION" "$GITHUB_WORKSPACE/launch_logcat.txt" && { echo "CRASH DETECTED"; exit 1; }; echo "Smoke test passed"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-logcat
          path: ${{ github.workspace }}/launch_logcat.txt
          retention-days: 7
