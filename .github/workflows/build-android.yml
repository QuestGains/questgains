name: Build Android TWA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install build tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-36" > /dev/null 2>&1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Restore keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/questgains-release.keystore
      
      - name: Build AAB
        run: |
          cd twa-android
          gradle bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/questgains-release.keystore \
            -Pandroid.injected.signing.store.password=questgains2025 \
            -Pandroid.injected.signing.key.alias=questgains \
            -Pandroid.injected.signing.key.password=questgains2025 \
            --stacktrace

      - name: Find outputs
        run: find twa-android -name "*.aab" -o -name "*.apk" | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: questgains-android
          path: twa-android/app/build/outputs/**/*.aab
          retention-days: 30
