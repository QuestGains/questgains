name: Build Android TWA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: |
          sudo apt-get install -y expect
          npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore $GITHUB_WORKSPACE/questgains-release.keystore \
            -alias questgains \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass questgains2025 -keypass questgains2025 \
            -dname "CN=QuestGains, O=QuestGains, L=Clearfield, S=Pennsylvania, C=US"

      - name: Init TWA project
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/questgains-release.keystore"
          expect -c "
            set timeout 120
            spawn bubblewrap init \
              --manifest https://questgains.github.io/questgains/manifest.json \
              --directory ./twa-project
            expect -re {\(Y/n\)} { send \"No\r\" }
            expect -re {application name} { send \"QuestGains\r\" }
            expect -re {short name}       { send \"QuestGains\r\" }
            expect -re {package id}       { send \"com.questgains.app\r\" }
            expect -re {keystore}         { send \"$KEYSTORE_PATH\r\" }
            expect -re {key alias}        { send \"questgains\r\" }
            expect -re {key password}     { send \"questgains2025\r\" }
            expect -re {keystore password} { send \"questgains2025\r\" }
            expect eof
          "
        env:
          BUBBLEWRAP_ACCEPT_TERMS_OF_SERVICE: true

      - name: Build AAB with Gradle (no interactivity)
        run: |
          cd twa-project
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/questgains-release.keystore \
            -Pandroid.injected.signing.store.password=questgains2025 \
            -Pandroid.injected.signing.key.alias=questgains \
            -Pandroid.injected.signing.key.password=questgains2025

      - name: Locate build outputs
        run: find twa-project -name "*.aab" -o -name "*.apk" | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: questgains-android
          path: |
            twa-project/**/*.aab
            twa-project/**/*.apk
          retention-days: 30
