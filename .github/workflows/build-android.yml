name: Build Android TWA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install build tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore $GITHUB_WORKSPACE/questgains-release.keystore \
            -alias questgains \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass questgains2025 -keypass questgains2025 \
            -dname "CN=QuestGains, O=QuestGains, L=Clearfield, S=Pennsylvania, C=US"

      - name: Build AAB
        run: |
          cd twa-android
          gradle bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/questgains-release.keystore \
            -Pandroid.injected.signing.store.password=questgains2025 \
            -Pandroid.injected.signing.key.alias=questgains \
            -Pandroid.injected.signing.key.password=questgains2025 \
            --stacktrace

      - name: Find outputs
        run: find twa-android -name "*.aab" -o -name "*.apk" | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: questgains-android
          path: twa-android/app/build/outputs/**/*.aab
          retention-days: 30
