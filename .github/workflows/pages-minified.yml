# HELD / OPTIONAL: deploy a minified build to GitHub Pages.
# To enable: repo Settings → Pages → Source = "GitHub Actions". Manual trigger only until tested.
name: Deploy minified site to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd tools && npm ci || npm i && npm run build
      - run: for f in dist/*.js; do node --check "$f"; done
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
