workflows:
  ios-pwa-workflow:
    name: QuestGains iOS (PWA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
        - ios
      vars:
        BUNDLE_ID: "com.questgains.mobile"
        APP_NAME: "QuestGains"
        PWA_URL: "https://questgains.github.io/questgains/"
      xcode: latest
      cocoapods: default

    scripts:
      - name: Verify iOS project
        script: |
          echo "--- iOS project contents ---"
          ls ios/
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 2 | grep -v ".xcodeproj" | head -1)
          PROJ=$(find ios -name "*.xcodeproj" -maxdepth 2 | head -1)
          echo "Workspace: $WORKSPACE"
          echo "Project: $PROJ"
          if [ -z "$WORKSPACE" ] && [ -z "$PROJ" ]; then
            echo "ERROR: No Xcode project found"
            exit 1
          fi

      - name: Set build number
        script: |
          set -e
          PLIST="ios/QuestGains/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" "$PLIST"

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          else
            echo "No Podfile found, skipping CocoaPods"
          fi

      - name: Build iOS app
        script: |
          set -o pipefail
          ARCHIVE_PATH="/Users/builder/clone/QuestGains.xcarchive"
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 2 | grep -v ".xcodeproj" | head -1)
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -1)
          SCHEME=$(basename "${WORKSPACE:-$PROJ}" | sed 's/\..*//')
          echo "Building scheme: $SCHEME"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              archive \
              -allowProvisioningUpdates \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
              SUPPORTS_MACCATALYST=NO \
              ONLY_ACTIVE_ARCH=NO
          else
            xcodebuild -project "$PROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              archive \
              -allowProvisioningUpdates \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
              SUPPORTS_MACCATALYST=NO \
              ONLY_ACTIVE_ARCH=NO
          fi

      - name: Export IPA
        script: |
          ARCHIVE_PATH="/Users/builder/clone/QuestGains.xcarchive"
          cd ios
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Upload to TestFlight
        script: |
          IPA=$(find ios/build/ipa -name "*.ipa" | head -1)
          echo "Uploading $IPA to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --privateKeyPath <(echo "$APP_STORE_CONNECT_PRIVATE_KEY")

    artifacts:
      - ios/build/ipa/*.ipa

    publishing:
      email:
        recipients:
          - questgains2026@gmail.com
        notify:
          success: true
          failure: true
