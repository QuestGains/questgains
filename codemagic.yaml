workflows:
  ios-pwa-workflow:
    name: QuestGains iOS (PWA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios
      vars:
        BUNDLE_ID: "com.questgains.mobile"
        APP_NAME: "QuestGains"
        PWA_URL: "https://questgains.github.io/questgains/"
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install certificate and provisioning profile
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/distribution.p12
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > /tmp/QuestGains_AppStore.mobileprovision

          # Install certificate into keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/distribution.p12 -k build.keychain -P "$CM_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i /tmp/QuestGains_AppStore.mobileprovision | plutil -extract UUID raw -)
          cp /tmp/QuestGains_AppStore.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "Installed profile UUID: $PROFILE_UUID"

      - name: Fetch iOS package from PWABuilder
        script: |
          mkdir -p ios
          echo "Fetching iOS package from PWABuilder..."
          curl -s -X POST "https://pwabuilder-ios.centralus.cloudapp.azure.com/packages/create" \
            -H "Content-Type: application/json" \
            -d "{
              \"url\": \"$PWA_URL\",
              \"bundleId\": \"$BUNDLE_ID\",
              \"appName\": \"$APP_NAME\",
              \"imageUrl\": \"https://questgains.github.io/questgains/logo.png\",
              \"splashColor\": \"#030712\",
              \"progressBarColor\": \"#22c55e\",
              \"statusBarColor\": \"#030712\",
              \"navColor\": \"#030712\",
              \"permittedUrls\": [],
              \"manifestUrl\": \"https://questgains.github.io/questgains/manifest.json\"
            }" \
            --output ios_package.zip
          unzip -o ios_package.zip -d ios_extracted
          WORKSPACE=$(find ios_extracted -name "*.xcworkspace" -maxdepth 4 | head -1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(find ios_extracted -name "*.xcodeproj" -maxdepth 4 | head -1)
          fi
          echo "Found project: $WORKSPACE"
          cp -r "$(dirname "$WORKSPACE")"/* ios/
          ls ios/

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          else
            echo "No Podfile found, skipping CocoaPods"
          fi

      - name: Build iOS app
        script: |
          set -o pipefail
          ARCHIVE_PATH="$CM_BUILD_DIR/QuestGains.xcarchive"
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 2 | head -1)
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -1)
          SCHEME=$(basename "${WORKSPACE:-$PROJ}" | sed 's/\..*//')
          echo "Building scheme: $SCHEME"
          echo "Archive path: $ARCHIVE_PATH"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              archive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="QuestGains AppStore" | xcpretty && exit ${PIPESTATUS[0]}
          else
            xcodebuild -project "$PROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              archive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="QuestGains AppStore" | xcpretty && exit ${PIPESTATUS[0]}
          fi

      - name: Export IPA
        script: |
          ARCHIVE_PATH="$CM_BUILD_DIR/QuestGains.xcarchive"
          cd ios
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.questgains.mobile</key>
              <string>QuestGains AppStore</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

    artifacts:
      - ios/build/ipa/*.ipa

    integrations:
      app_store_connect: QuestGains

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"
