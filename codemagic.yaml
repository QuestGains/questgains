workflows:
  ios-pwa-workflow:
    name: QuestGains iOS (PWA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: QuestGains
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.questgains.mobile
      groups:
        - ios
      vars:
        BUNDLE_ID: "com.questgains.mobile"
        APP_NAME: "QuestGains"
        PWA_URL: "https://questgains.github.io/questgains/"
      xcode: latest
      cocoapods: default

    scripts:
      - name: Verify iOS project
        script: |
          echo "--- iOS project contents ---"
          ls ios/
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 2 | grep -v ".xcodeproj" | head -1)
          PROJ=$(find ios -name "*.xcodeproj" -maxdepth 2 | head -1)
          echo "Workspace: $WORKSPACE"
          echo "Project: $PROJ"
          if [ -z "$WORKSPACE" ] && [ -z "$PROJ" ]; then
            echo "ERROR: No Xcode project found"
            exit 1
          fi

      - name: Set build number
        script: |
          set -e
          PLIST="ios/QuestGains/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" "$PLIST"

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          else
            echo "No Podfile found, skipping CocoaPods"
          fi

      - name: Build iOS app
        script: |
          set -o pipefail
          ARCHIVE_PATH="/Users/builder/clone/QuestGains.xcarchive"
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 2 | grep -v ".xcodeproj" | head -1)
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -1)
          SCHEME=$(basename "${WORKSPACE:-$PROJ}" | sed 's/\..*//')
          echo "Building scheme: $SCHEME"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              archive \
              DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
              SUPPORTS_MACCATALYST=NO \
              ONLY_ACTIVE_ARCH=NO
          else
            xcodebuild -project "$PROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              archive \
              DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
              SUPPORTS_MACCATALYST=NO \
              ONLY_ACTIVE_ARCH=NO
          fi

      - name: Export IPA
        script: |
          ARCHIVE_PATH="/Users/builder/clone/QuestGains.xcarchive"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath ios/build/ipa

    artifacts:
      - ios/build/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - questgains2026@gmail.com
        notify:
          success: true
          failure: true
