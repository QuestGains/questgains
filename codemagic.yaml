workflows:
  ios-pwa-workflow:
    name: QuestGains iOS (PWA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios
      vars:
        BUNDLE_ID: "com.questgains.mobile"
        APP_NAME: "QuestGains"
        PWA_URL: "https://questgains.github.io/questgains/"
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install certificate and provisioning profile
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/distribution.p12
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > /tmp/QuestGains_AppStore.mobileprovision

          # Use Codemagic keychain CLI
          keychain initialize
          keychain add-certificates --certificate /tmp/distribution.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i /tmp/QuestGains_AppStore.mobileprovision | plutil -extract UUID raw -)
          echo "Profile UUID: $PROFILE_UUID"
          cp /tmp/QuestGains_AppStore.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

          # Verify signing identity is available
          security find-identity -v -p codesigning

      - name: Verify iOS project
        script: |
          echo "--- iOS project contents ---"
          ls ios/
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 2 | grep -v ".xcodeproj" | head -1)
          PROJ=$(find ios -name "*.xcodeproj" -maxdepth 2 | head -1)
          echo "Workspace: $WORKSPACE"
          echo "Project: $PROJ"
          if [ -z "$WORKSPACE" ] && [ -z "$PROJ" ]; then
            echo "ERROR: No Xcode project found"
            exit 1
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          else
            echo "No Podfile found, skipping CocoaPods"
          fi

      - name: Build iOS app
        script: |
          set -o pipefail
          ARCHIVE_PATH="/Users/builder/clone/QuestGains.xcarchive"
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 2 | grep -v ".xcodeproj" | head -1)
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -1)
          SCHEME=$(basename "${WORKSPACE:-$PROJ}" | sed 's/\..*//')
          echo "Building scheme: $SCHEME"
          echo "Archive path: $ARCHIVE_PATH"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              archive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="QuestGains AppStore" \
              SUPPORTS_MACCATALYST=NO \
              ONLY_ACTIVE_ARCH=NO
          else
            xcodebuild -project "$PROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              archive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="QuestGains AppStore" \
              SUPPORTS_MACCATALYST=NO \
              ONLY_ACTIVE_ARCH=NO
          fi

      - name: Export IPA
        script: |
          ARCHIVE_PATH="/Users/builder/clone/QuestGains.xcarchive"
          cd ios
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.questgains.mobile</key>
              <string>QuestGains AppStore</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

    artifacts:
      - ios/build/ipa/*.ipa

    integrations:
      app_store_connect: QuestGains

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"
